<div class="add-container">
  <div class="add-wrapper">
    <!-- Header -->

    <div class="page-header">
      <div>
        <button type="button" class="back-btn" (click)="cancel()">← Back to Hotels</button>

        <h1>Add Hotel</h1>

        <p>Create a new hotel and upload its images.</p>
      </div>
    </div>

    <!-- Success -->

    <div *ngIf="successMessage" class="alert success">✓ {{ successMessage }}</div>

    <!-- Error -->

    <div *ngIf="errorMessage" class="alert error">
      {{ errorMessage }}
    </div>

    <form class="hotel-form" (ngSubmit)="createHotel()">
      <!-- Hotel Information -->

      <div class="form-card">
        <div class="card-header">
          <h2>Hotel Information</h2>

          <p>Enter the basic hotel information.</p>
        </div>

        <div class="form-body">
          <!-- Name -->

          <div class="form-group full">
            <label>
              Hotel Name
              <span>*</span>
            </label>

            <input
              type="text"
              name="name"
              [(ngModel)]="hotelData.name"
              placeholder="Enter hotel name"
              required
            />
          </div>

          <!-- Description -->

          <div class="form-group full">
            <label>
              Description
              <span>*</span>
            </label>

            <textarea
              name="description"
              rows="5"
              [(ngModel)]="hotelData.description"
              placeholder="Enter hotel description"
              required
            >
            </textarea>
          </div>

          <!-- Address -->

          <div class="form-group full">
            <label>
              Address
              <span>*</span>
            </label>

            <textarea
              name="address"
              rows="3"
              [(ngModel)]="hotelData.address"
              placeholder="Enter hotel address"
              required
            >
            </textarea>
          </div>

          <!-- Destination -->

          <div class="form-group">
            <label>
              Destination
              <span>*</span>
            </label>

            <select name="destinationId" [(ngModel)]="hotelData.destinationId" required>
              <option [ngValue]="0">Select Destination</option>

              <option *ngFor="let destination of destinations" [ngValue]="destination.id">
                {{ destination.name }}
              </option>
            </select>
          </div>

          <!-- Star Rating -->

          <div class="form-group">
            <label>
              Star Rating
              <span>*</span>
            </label>

            <select name="starRating" [(ngModel)]="hotelData.starRating">
              <option [ngValue]="1">★ 1 Star</option>

              <option [ngValue]="2">★★ 2 Stars</option>

              <option [ngValue]="3">★★★ 3 Stars</option>

              <option [ngValue]="4">★★★★ 4 Stars</option>

              <option [ngValue]="5">★★★★★ 5 Stars</option>
            </select>
          </div>

          <!-- Price -->

          <div class="form-group">
            <label>
              Price Per Night
              <span>*</span>
            </label>

            <div class="price-input">
              <span>₹</span>

              <input
                type="number"
                name="pricePerNight"
                [(ngModel)]="hotelData.pricePerNight"
                min="1"
                placeholder="0"
                required
              />
            </div>
          </div>

          <!-- Availability -->

          <div class="form-group">
            <label> Availability </label>

            <label class="switch-label">
              <input type="checkbox" name="isAvailable" [(ngModel)]="hotelData.isAvailable" />

              <span> Hotel is available for booking </span>
            </label>
          </div>
        </div>
      </div>

      <!-- Images -->

      <div class="form-card">
        <div class="card-header">
          <h2>Hotel Images</h2>

          <p>Upload one or more images of the hotel.</p>
        </div>

        <div class="images-body">
          <!-- Upload -->

          <div class="upload-box">
            <input
              type="file"
              id="hotelImages"
              multiple
              accept="image/*"
              (change)="onImagesSelected($event)"
            />

            <label for="hotelImages" class="upload-label">
              <div class="upload-icon">📷</div>

              <strong> Choose Hotel Images </strong>

              <span> You can select multiple images </span>
            </label>
          </div>

          <!-- Preview -->

          <div *ngIf="imagePreviews.length > 0" class="preview-section">
            <div class="preview-header">
              <h3>Selected Images</h3>

              <span> {{ imagePreviews.length }} image(s) </span>
            </div>

            <div class="preview-grid">
              <div class="preview-item" *ngFor="let image of imagePreviews; let i = index">
                <img [src]="image" alt="Hotel preview" />

                <button type="button" class="remove-btn" (click)="removeSelectedImage(i)">×</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>

        <button type="submit" class="save-btn" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting"> Create Hotel </span>

          <span *ngIf="isSubmitting">
            {{ isUploadingImages ? 'Uploading Images...' : 'Creating...' }}
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
